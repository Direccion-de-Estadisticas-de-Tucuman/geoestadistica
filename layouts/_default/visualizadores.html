{{ partial "header.html" . }}
<main>
  <div class="wrapper" style="min-height: 100dvh;">
    {{ range.Data.Pages }}
    <section class="section mapa-en-lista" style="margin: 1rem;">
      <h3>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h3>
      {{ $image := resources.Get "images/ipmhaplicaciones.png"}}
      {{ with $image }}
      <img  src="{{ $image.RelPermalink }}">
      {{ end }}

        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
            {{ dateFormat "January 2, 2006" .Date }}
        </time>
    </section>
    {{end}}
  </div>
</main>
{{ partial "footer.html" . }}
