{{ partial "header.html" . }}
<main>
  <div class="wrapper">
    {{ range.Data.Pages }}
    <section class="section">
      <h3>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h3>
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
            {{ dateFormat "January 2, 2006" .Date }}
        </time>
    </section>
    {{end}}
  </div>
</main>
{{ partial "footer.html" . }}
